      var dot = overlay.querySelector('.onboarding-dot[data-step="' + n + '"]');
      if (step) step.style.display = '';
      if (dot) {
        dot.classList.add('active');
        dot.setAttribute('aria-selected', 'true');
      }
      nextBtn.textContent = n === totalSteps ? 'Get Started' : 'Next';
    }

    function dismiss() {
      overlay.setAttribute('aria-hidden', 'true');
      overlay.style.display = 'none';
      localStorage.setItem(STORAGE_KEY, '1');
      // Return focus to body
      document.body.focus();
    }

    // Tab trap: keep focus inside the onboarding card
    overlay.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        e.stopImmediatePropagation();
        dismiss();
        return;
      }
      if (e.key === 'Tab' && card) {
        var focusable = card.querySelectorAll(
          'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
        );
        if (focusable.length === 0) return;
        var first = focusable[0];
        var last = focusable[focusable.length - 1];
        if (e.shiftKey) {
          if (document.activeElement === first) {
            e.preventDefault();
            last.focus();
          }
        } else {
          if (document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      }
    });

    nextBtn.addEventListener('click', function () {
      if (currentStep >= totalSteps) {
        dismiss();
        return;
      }
      currentStep++;
      showStep(currentStep);
    });

    skipBtn.addEventListener('click', dismiss);
    var backdrop = overlay.querySelector('.onboarding-backdrop');
    if (backdrop) backdrop.addEventListener('click', dismiss);

    // Show the overlay (runs after init/loadBoard has already been called)
    overlay.style.display = '';
    overlay.setAttribute('aria-hidden', 'false');
    showStep(1);
    // Move focus to the Next button
    setTimeout(function () {
      nextBtn.focus();
    }, 0);
  }

  // ── Help Popovers ────────────────────────────────────────────────────
  (function initHelpPopovers() {
    var HELP_CONTENT = {
      availability:
        'This board shows all EV chargers in real time. Green means free — tap a charger to start charging. Blue means someone is using it. Purple means reserved for an upcoming slot.',
      legend:
        '<strong>Free</strong> = available to use now<br><strong>In Use</strong> = someone is actively charging<br><strong>Reserved</strong> = booked for an upcoming time slot<br><strong>Overdue</strong> = session has exceeded the maximum time limit'
    };

    var popover = document.getElementById('help-popover');
    var content = document.getElementById('help-popover-content');
    var closeBtn = popover ? popover.querySelector('.help-popover__close') : null;
    var activeKey = null;
    var activeTrigger = null;

    if (!popover) return;

    function updateTriggerAria(expanded) {
      document.querySelectorAll('.help-trigger[aria-expanded]').forEach(function (t) {
        t.setAttribute('aria-expanded', 'false');
      });
      if (expanded && activeTrigger) {
        activeTrigger.setAttribute('aria-expanded', 'true');
      }
    }

    function show(key, triggerEl) {
      var text = HELP_CONTENT[key];
      if (!text) return;
      // Toggle off if same key is already showing
      if (activeKey === key && popover.classList.contains('active')) {
        hide();
        return;
      }
      activeTrigger = triggerEl || null;
      content.innerHTML = text;
      popover.setAttribute('aria-hidden', 'false');
      popover.classList.add('active');
      activeKey = key;
      updateTriggerAria(true);
      // Move focus to close button
      if (closeBtn)
        setTimeout(function () {
          closeBtn.focus();
        }, 0);
    }

    function hide() {
      popover.setAttribute('aria-hidden', 'true');
      popover.classList.remove('active');
      updateTriggerAria(false);
      // Return focus to the trigger that opened the popover
      if (activeTrigger && typeof activeTrigger.focus === 'function') {
        activeTrigger.focus();
      }
      activeKey = null;
      activeTrigger = null;
    }

    document.addEventListener('click', function (e) {
      var trigger = e.target.closest('.help-trigger');
      if (trigger) {
        e.preventDefault();
        e.stopPropagation();
        show(trigger.dataset.help, trigger);
        return;
      }
      if (!e.target.closest('.help-popover') && popover.classList.contains('active')) {
        hide();
      }
    });

    // Escape key closes popover (stop propagation so global handler doesn't also fire)
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && popover.classList.contains('active')) {
        e.stopImmediatePropagation();
        hide();
      }
    });

    if (closeBtn) closeBtn.addEventListener('click', hide);
  })();
</script>
